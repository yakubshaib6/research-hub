<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Response Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; color: #6b7280; }
        .btn-delete { background: #fee2e2; color: #991b1b; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color:#6b7280; text-decoration:none;">← Back</a>
        <div class="card">
            <h1 id="pTitle">Loading...</h1>
            <table id="responseTable">
                <thead><tr><th>Date</th><th>Response</th><th>Action</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const projects = JSON.parse(localStorage.getItem('hubProjects')) || [];
        const p = projects[id];
        
        if(p) {
            document.getElementById('pTitle').innerText = `Responses: ${p.title}`;
            const allResponses = JSON.parse(localStorage.getItem('allResponses')) || {};
            const projectResponses = allResponses[id] || [];
            const tbody = document.getElementById('tableBody');
            
            if(projectResponses.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>No responses yet.</td></tr>";
            } else {
                projectResponses.reverse().forEach((row, index) => {
                    tbody.innerHTML += `<tr><td>${row.date}</td><td>${row.response}</td><td><button class="btn-delete" onclick="deleteResponse(${index})">Delete</button></td></tr>`;
                });
            }
        }

        function deleteResponse(index) {
            let allResponses = JSON.parse(localStorage.getItem('allResponses')) || {};
            if(allResponses[id]) {
                allResponses[id].splice(index, 1); // Remove the item
                localStorage.setItem('allResponses', JSON.stringify(allResponses));
                location.reload(); // Refresh page
            }
        }
    </script>
</body>
</html>
