<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Response Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav { margin-bottom: 1.5rem; }
        .nav a { text-decoration: none; color: #6b7280; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 1rem; background: #f9fafb; color: #6b7280; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav"><a href="index.html">← Back to Dashboard</a></div>
        <div class="card">
            <h1 id="pTitle">Loading Responses...</h1>
            <table id="responseTable">
                <thead>
                    <tr><th>Date</th><th>Response</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/yedcljothjgh6";

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const projects = JSON.parse(localStorage.getItem('hubProjects')) || [];
        const p = projects[id];

        if(p) {
            document.getElementById('pTitle').innerText = `Responses: ${p.title}`;
            loadData();
        }

        async function loadData() {
            try {
                const res = await fetch(SHEETDB_URL);
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                
                const filtered = data.filter(row => row.Project === p.title);
                
                if(filtered.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No responses yet.</td></tr>";
                } else {
                    tbody.innerHTML = '';
                    filtered.reverse().forEach((row) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${row.Date}</td>
                                <td>${row.Response}</td>
                            </tr>`;
                    });
                }
            } catch (error) {
                document.getElementById('tableBody').innerHTML = "<tr><td colspan='2'>Error loading data. Check SheetDB link.</td></tr>";
            }
        }
    </script>
</body>
</html>
