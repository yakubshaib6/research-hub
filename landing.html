<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research Response</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
        .card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
        h1 { color: #111827; font-size: 1.5rem; margin-top: 0; }
        p { color: #6b7280; white-space: pre-wrap; }
        label { display: block; margin-top: 1rem; font-size: 0.875rem; font-weight: 600; color: #374151; }
        input, textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-family: inherit; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; }
        button, .btn-link { background: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; width: 100%; margin-top: 1.5rem; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        .btn-link { background: #f3f4f6; color: #1f2937; margin-top: 0.5rem; }
        .success { display: none; text-align: center; padding: 2rem 0; }
        .error { color: #b91c1c; font-size: 0.875rem; margin: 1rem 0 0; white-space: normal; }
        .hidden { display: none; }
        h1, p { word-break: break-word; }
        input, textarea { font-size: 1rem; }
        @media (max-width: 480px) {
            body { align-items: flex-start; padding: 0.75rem; }
            .card { padding: 1.5rem; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="formContent">
            <h1 id="pTitle">Loading...</h1>
            <p id="pDesc"></p>
            <a id="extLinkBtn" href="#" class="btn-link hidden" target="_blank" rel="noopener noreferrer">Open the research material</a>
            <form id="surveyForm" class="hidden">
                <label for="name">Your name (optional)</label>
                <input type="text" id="name" maxlength="200">
                <label for="answer">Your response</label>
                <textarea id="answer" rows="5" maxlength="5000" required></textarea>
                <p id="formError" class="error"></p>
                <button type="submit" id="submitBtn">Submit Response</button>
            </form>
        </div>
        <div id="successMsg" class="success"><h2>Thank you</h2><p>Your response has been recorded.</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const $ = el => document.getElementById(el);

        async function init() {
            if (!id) { $('pTitle').textContent = 'Invalid link'; return; }
            const { data, error } = await db.rpc('get_space', { p_id: id });
            const space = data && data[0];
            if (error || !space) { $('pTitle').textContent = 'This research space was not found'; return; }

            document.title = space.title;
            $('pTitle').textContent = space.title;
            $('pDesc').textContent = space.description || '';

            const link = space.external_link ? safeUrl(space.external_link) : '';
            if (link) {
                $('extLinkBtn').href = link;
                $('extLinkBtn').classList.remove('hidden');
            }
            $('surveyForm').classList.remove('hidden');
        }

        $('surveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            $('submitBtn').disabled = true;
            $('formError').textContent = '';
            const { error } = await db.rpc('submit_response', {
                p_space_id: id,
                p_name: $('name').value,
                p_answer: $('answer').value
            });
            if (error) {
                $('formError').textContent = 'Could not submit: ' + error.message;
                $('submitBtn').disabled = false;
                return;
            }
            $('formContent').classList.add('hidden');
            $('successMsg').style.display = 'block';
        });

        init();
    </script>
</body>
</html>
