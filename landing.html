<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
        h1 { color: #111827; font-size: 1.5rem; margin-top: 0; }
        p { color: #6b7280; line-height: 1.6; }
        label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; color: #374151; }
        textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-family: inherit; resize: vertical; }
        button, .btn-link { background: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 1.5rem; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .success { display: none; text-align: center; padding: 2rem; }
        .success h2 { color: #166534; }
    </style>
</head>
<body>
    <div class="card">
        <div id="formContent">
            <h1 id="pTitle">Loading...</h1>
            <p id="pDesc"></p>
            
            <a id="extLinkBtn" href="#" class="btn-link" style="display:none;">Go to Survey Form</a>

            <form id="surveyForm" style="display:none;">
                <label>Your Response</label>
                <textarea name="Response" rows="5" placeholder="Type your answer here..." required></textarea>
                <button type="submit">Submit Response</button>
            </form>
        </div>
        <div id="successMsg" class="success">
            <h2>✅ Success!</h2>
            <p>Your response has been recorded in the central system.</p>
        </div>
    </div>
    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/yedcljothjgh6"; 
        
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const projects = JSON.parse(localStorage.getItem('hubProjects')) || [];
        const p = projects[id];

        if(p) {
            document.getElementById('pTitle').innerText = p.title;
            document.getElementById('pDesc').innerText = p.desc;

            if (p.link) {
                document.getElementById('extLinkBtn').href = p.link;
                document.getElementById('extLinkBtn').style.display = 'inline-block';
            } else {
                document.getElementById('surveyForm').style.display = 'block';
                
                document.getElementById('surveyForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const data = Object.fromEntries(formData);
                    
                    data.Project = p.title; 
                    data.Date = new Date().toLocaleString();

                    try {
                        await fetch(SHEETDB_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ data: [data] })
                        });
                        
                        document.getElementById('formContent').style.display = 'none';
                        document.getElementById('successMsg').style.display = 'block';
                    } catch (error) {
                        alert("Error submitting. Please check your internet.");
                    }
                });
            }
        } else {
            document.getElementById('pTitle').innerText = "Project Not Found";
        }
    </script>
</body>
</html>
